name: $(Year:yy).$(Month).$(DayOfMonth).$(rev:r)

pr:
  branches:
    include: [main, feature/*, release/*]
trigger:
  branches:
    include: [main, feature/*, release/*]
  batch: true

pool:
  vmImage: windows-2022

steps:
- task: UseDotNet@2
  displayName: Use pinned stable .NET SDK
  inputs:
    packageType: sdk
    useGlobalJson: true
    workingDirectory: source/dotnet
- task: UseDotNet@2
  displayName: Install .NET 8 runtime for retained package consumer
  inputs:
    packageType: runtime
    version: 8.0.x
- pwsh: |
    dotnet build AdaptiveCards.Modern.slnx -c Release --nologo
    if ($LASTEXITCODE) { exit $LASTEXITCODE }
    .\RunAllTests.ps1 -IncludeRendering -CollectCoverage
  workingDirectory: source/dotnet
  displayName: Build SDK and test modern/compatible assets on .NET 10
- pwsh: |
    dotnet build Samples\WPFVisualizerNet6\AdaptiveCards.Sample.WPFVisualizer.Net6.csproj -c Release -f net10.0-windows -p:PublicBuild=true --nologo
    if ($LASTEXITCODE) { exit $LASTEXITCODE }
    dotnet build Library\AdaptiveCards.Rendering.Wpf.Net6\AdaptiveCards.Rendering.Wpf.Net6.csproj -c Release -p:PublicBuild=true --nologo
    if ($LASTEXITCODE) { exit $LASTEXITCODE }
    .\NuGet\TestWpfReleaseGate.ps1
    .\NuGet\PackSdk.ps1
    .\NuGet\TestPackages.ps1
  workingDirectory: source/dotnet
  displayName: Build public desktop sample and verify actual packages
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: source/dotnet/TestResults/**/*.trx
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: source/dotnet/artifacts/packages
    artifact: dotnet-sdk-packages
- task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
  displayName: Component Detection
